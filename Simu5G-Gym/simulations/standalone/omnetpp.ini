# omnetpp.ini

# ═══════════════════════════════════════════════════════════════════════════
# [General] – shared base for all configurations
# ═══════════════════════════════════════════════════════════════════════════
[General]
abstract = true

**.routingRecorder.enabled  = false
cmdenv-express-mode         = true
cmdenv-autoflush            = false
cmdenv-status-frequency     = 10s

# ── Statistics ────────────────────────────────────────────────────────────
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set           = ${repetition}
**.vector-recording    = false
**.scalar-recording    = true
**.statistic-recording = true
**.collectSinrStatistics = true

# ── Mobility constraint area ──────────────────────────────────────────────
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

# ── Radio ─────────────────────────────────────────────────────────────────
**.numBands      = 25
**.ueTxPower     = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler    = 0.01
**.blerShift     = 5

# ── Network ───────────────────────────────────────────────────────────────
*.configurator.config = xmldoc("./demo.xml")


# ═══════════════════════════════════════════════════════════════════════════
# [Config Standalone]
# Base NR standalone topology used by all RL scenarios
# ═══════════════════════════════════════════════════════════════════════════
[Config Standalone]
abstract = true
network  = StandaloneGym

# ── Gym interface ─────────────────────────────────────────────────────────
*.gym.host              = "127.0.0.1"
*.gym.port              = 5555
**.gym.action_space     = "Box(low=0.0, high=2.0, shape=(1,))"
*.gym.observation_space = "gym.spaces.Box(low=-1e9, high=1e9, shape=(8,), dtype=float)"
*.gym.tickInterval      = 0.1s

# ── Energy model ──────────────────────────────────────────────────────────
*.gym.pActive    = 100W
*.gym.pSleep     = 10W
*.gym.txPowerMin = 0dBm

# ── gNB ───────────────────────────────────────────────────────────────────
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

# ── UE base ───────────────────────────────────────────────────────────────
*.numUe = 1
*.ue[*].macCellId   = 0
*.ue[*].masterId    = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId  = 1
*.ue[*].mobility.initialX = uniform(350m, 550m)
*.ue[*].mobility.initialY = uniform(250m, 450m)


# ═══════════════════════════════════════════════════════════════════════════
# [Config VarTraffic-Base]
#
# Abstract base for all three Train-* scenarios.
#
# Phase layout (per UE):
#
#   Phase 1  0  – 20 s   Light load      512 B  @ 0.010 s   ~410 kbps
#   Phase 2  20 – 40 s   Heavy load     1500 B  @ 0.005 s  ~2.4 Mbps
#   Phase 3  40 – 60 s   Bursty medium  — three overlapping senders —
#            40 – 60 s     trickle        400 B  @ 0.015 s   ~213 kbps
#            40 – 47 s     burst-A       1500 B  @ 0.004 s  ~3.0 Mbps
#            47 – 52 s     (gap — trickle only, quiet window)
#            52 – 60 s     burst-B       1500 B  @ 0.004 s  ~3.0 Mbps
#
# Aggregate Phase 3 load: HIGH → quiet → HIGH
# All three Phase 3 senders target port 3002 and are summed at the
# receiver automatically; no Simu5G changes are required.
#
# Server app index layout (N = numUe, total apps = 5 * N):
#
#   Block          Indices      Port   Role
#   ─────────────────────────────────────────────────────
#   P1             0  … N-1     3000   Phase 1 sender
#   P2             N  … 2N-1    3001   Phase 2 sender
#   P3-trickle     2N … 3N-1    3002   Phase 3 constant low baseline
#   P3-burstA      3N … 4N-1    3002   Phase 3 burst window 40–47 s
#   P3-burstB      4N … 5N-1    3002   Phase 3 burst window 52–60 s
#
# Each concrete config MUST set:
#   *.numUe          = N          (literal integer)
#   *.server.numApps = 5 * N      (literal integer)
# ═══════════════════════════════════════════════════════════════════════════
[Config VarTraffic-Base]
extends        = Standalone
abstract       = true
sim-time-limit = 60s

**.bgCellInterference   = true
**.downlinkInterference = true
**.uplinkInterference   = true

# Every UE runs three receiver apps, one per phase.
# Multiple server senders may target the same port and are summed at
# the receiver transparently by INET / Simu5G.
*.ue[*].numApps = 3

*.ue[*].app[0].typename  = "CbrReceiver"
*.ue[*].app[0].localPort = 3000       # Phase 1

*.ue[*].app[1].typename  = "CbrReceiver"
*.ue[*].app[1].localPort = 3001       # Phase 2

*.ue[*].app[2].typename  = "CbrReceiver"
*.ue[*].app[2].localPort = 3002       # Phase 3 (all burst senders land here)


# ═══════════════════════════════════════════════════════════════════════════
# [Config Train-Simple]
# Scenario 1 – 1 UE · 1 gNB · minor background interference
#
# Purpose: teach the agent basic single-user downlink power control before
#          it must cope with multi-user scheduling or mobility.
#
# Server app index map (N=1, total=5):
#   app[0]  Phase 1 sender           → ue[0]:3000   0 – 20 s
#   app[1]  Phase 2 sender           → ue[0]:3001  20 – 40 s
#   app[2]  Phase 3 trickle          → ue[0]:3002  40 – 60 s
#   app[3]  Phase 3 burst-A          → ue[0]:3002  40 – 47 s
#   app[4]  Phase 3 burst-B          → ue[0]:3002  52 – 60 s
# ═══════════════════════════════════════════════════════════════════════════
[Config Train-Simple]
extends    = VarTraffic-Base
repeat     = 50
result-dir = results-train/simple

*.numUe          = 1
*.server.numApps = 5

# ── Phase 1: light load (0 – 20 s) ───────────────────────────────────────
*.server.app[0].typename     = "CbrSender"
*.server.app[0].destAddress  = "ue[0]"
*.server.app[0].destPort     = 3000
*.server.app[0].localPort    = 4000
*.server.app[0].packetSize   = 512B
*.server.app[0].samplingTime = 0.010s
*.server.app[0].startTime    = 0s
*.server.app[0].finishTime   = 20s

# ── Phase 2: heavy load (20 – 40 s) ──────────────────────────────────────
*.server.app[1].typename     = "CbrSender"
*.server.app[1].destAddress  = "ue[0]"
*.server.app[1].destPort     = 3001
*.server.app[1].localPort    = 4001
*.server.app[1].packetSize   = 1500B
*.server.app[1].samplingTime = 0.005s
*.server.app[1].startTime    = 20s
*.server.app[1].finishTime   = 40s

# ── Phase 3 trickle: constant low baseline (40 – 60 s, ~213 kbps) ────────
*.server.app[2].typename     = "CbrSender"
*.server.app[2].destAddress  = "ue[0]"
*.server.app[2].destPort     = 3002
*.server.app[2].localPort    = 4002
*.server.app[2].packetSize   = 400B
*.server.app[2].samplingTime = 0.015s
*.server.app[2].startTime    = 40s
*.server.app[2].finishTime   = 60s

# ── Phase 3 burst-A: high-rate window (40 – 47 s, ~3.0 Mbps) ─────────────
# Combined with trickle: ~3.2 Mbps aggregate
*.server.app[3].typename     = "CbrSender"
*.server.app[3].destAddress  = "ue[0]"
*.server.app[3].destPort     = 3002
*.server.app[3].localPort    = 4003
*.server.app[3].packetSize   = 1500B
*.server.app[3].samplingTime = 0.004s
*.server.app[3].startTime    = 40s
*.server.app[3].finishTime   = 47s

# ── Phase 3 burst-B: high-rate window (52 – 60 s, ~3.0 Mbps) ─────────────
# 47 – 52 s is trickle-only (quiet window); agent must adapt power down here
*.server.app[4].typename     = "CbrSender"
*.server.app[4].destAddress  = "ue[0]"
*.server.app[4].destPort     = 3002
*.server.app[4].localPort    = 4004
*.server.app[4].packetSize   = 1500B
*.server.app[4].samplingTime = 0.004s
*.server.app[4].startTime    = 52s
*.server.app[4].finishTime   = 60s

# ── Background interference: 1 cell, low power ───────────────────────────
*.numBgCells = 1
*.bgCell[0].bgScheduler.isNr    = true
*.bgCell[0].bgScheduler.txPower = 20dBm

*.bgCell[0].mobility.initialX = 750m
*.bgCell[0].mobility.initialY = 300m

*.bgCell[0].bgTrafficGenerator.numBgUes                       = 3
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 0.5s)
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 512B
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.periodDl     = 0.010s


# ═══════════════════════════════════════════════════════════════════════════
# [Config Train-Multi]
# Scenario 2 – 2 UEs · 1 gNB · moderate background interference
#
# Purpose: introduce multi-user resource sharing. The agent must balance
#          power across two UEs competing for the same scheduler slots,
#          each running the same three-phase variable traffic profile.
#
# Server app index map (N=2, total=10):
#   Block          Indices   UE target   Role
#   ────────────────────────────────────────────────
#   P1             0, 1      ue[0,1]:3000  Phase 1
#   P2             2, 3      ue[0,1]:3001  Phase 2
#   P3-trickle     4, 5      ue[0,1]:3002  Phase 3 trickle
#   P3-burstA      6, 7      ue[0,1]:3002  Phase 3 burst-A (40–47 s)
#   P3-burstB      8, 9      ue[0,1]:3002  Phase 3 burst-B (52–60 s)
# ═══════════════════════════════════════════════════════════════════════════
[Config Train-Multi]
extends    = VarTraffic-Base
repeat     = 50
result-dir = results-train/multi

*.numUe          = 2
*.server.numApps = 10

# ── Phase 1: light load (0 – 20 s) ───────────────────────────────────────
*.server.app[0].typename     = "CbrSender"
*.server.app[0].destAddress  = "ue[0]"
*.server.app[0].destPort     = 3000
*.server.app[0].localPort    = 4000
*.server.app[0].packetSize   = 512B
*.server.app[0].samplingTime = 0.010s
*.server.app[0].startTime    = 0s
*.server.app[0].finishTime   = 20s

*.server.app[1].typename     = "CbrSender"
*.server.app[1].destAddress  = "ue[1]"
*.server.app[1].destPort     = 3000
*.server.app[1].localPort    = 4001
*.server.app[1].packetSize   = 512B
*.server.app[1].samplingTime = 0.010s
*.server.app[1].startTime    = 0s
*.server.app[1].finishTime   = 20s

# ── Phase 2: heavy load (20 – 40 s) ──────────────────────────────────────
*.server.app[2].typename     = "CbrSender"
*.server.app[2].destAddress  = "ue[0]"
*.server.app[2].destPort     = 3001
*.server.app[2].localPort    = 4100
*.server.app[2].packetSize   = 1500B
*.server.app[2].samplingTime = 0.005s
*.server.app[2].startTime    = 20s
*.server.app[2].finishTime   = 40s

*.server.app[3].typename     = "CbrSender"
*.server.app[3].destAddress  = "ue[1]"
*.server.app[3].destPort     = 3001
*.server.app[3].localPort    = 4101
*.server.app[3].packetSize   = 1500B
*.server.app[3].samplingTime = 0.005s
*.server.app[3].startTime    = 20s
*.server.app[3].finishTime   = 40s

# ── Phase 3 trickle: constant low baseline (40 – 60 s) ───────────────────
*.server.app[4].typename     = "CbrSender"
*.server.app[4].destAddress  = "ue[0]"
*.server.app[4].destPort     = 3002
*.server.app[4].localPort    = 4200
*.server.app[4].packetSize   = 400B
*.server.app[4].samplingTime = 0.015s
*.server.app[4].startTime    = 40s
*.server.app[4].finishTime   = 60s

*.server.app[5].typename     = "CbrSender"
*.server.app[5].destAddress  = "ue[1]"
*.server.app[5].destPort     = 3002
*.server.app[5].localPort    = 4201
*.server.app[5].packetSize   = 400B
*.server.app[5].samplingTime = 0.015s
*.server.app[5].startTime    = 40s
*.server.app[5].finishTime   = 60s

# ── Phase 3 burst-A: high-rate window (40 – 47 s) ────────────────────────
*.server.app[6].typename     = "CbrSender"
*.server.app[6].destAddress  = "ue[0]"
*.server.app[6].destPort     = 3002
*.server.app[6].localPort    = 4300
*.server.app[6].packetSize   = 1500B
*.server.app[6].samplingTime = 0.004s
*.server.app[6].startTime    = 40s
*.server.app[6].finishTime   = 47s

*.server.app[7].typename     = "CbrSender"
*.server.app[7].destAddress  = "ue[1]"
*.server.app[7].destPort     = 3002
*.server.app[7].localPort    = 4301
*.server.app[7].packetSize   = 1500B
*.server.app[7].samplingTime = 0.004s
*.server.app[7].startTime    = 40s
*.server.app[7].finishTime   = 47s

# ── Phase 3 burst-B: high-rate window (52 – 60 s) ────────────────────────
# 47 – 52 s is trickle-only across both UEs
*.server.app[8].typename     = "CbrSender"
*.server.app[8].destAddress  = "ue[0]"
*.server.app[8].destPort     = 3002
*.server.app[8].localPort    = 4400
*.server.app[8].packetSize   = 1500B
*.server.app[8].samplingTime = 0.004s
*.server.app[8].startTime    = 52s
*.server.app[8].finishTime   = 60s

*.server.app[9].typename     = "CbrSender"
*.server.app[9].destAddress  = "ue[1]"
*.server.app[9].destPort     = 3002
*.server.app[9].localPort    = 4401
*.server.app[9].packetSize   = 1500B
*.server.app[9].samplingTime = 0.004s
*.server.app[9].startTime    = 52s
*.server.app[9].finishTime   = 60s

# ── Moderate background interference ─────────────────────────────────────
*.numBgCells = 2
*.bgCell[*].bgScheduler.isNr    = true
*.bgCell[*].bgScheduler.txPower = 30dBm

*.bgCell[0].mobility.initialX = 750m
*.bgCell[0].mobility.initialY = 300m
*.bgCell[1].mobility.initialX = 150m
*.bgCell[1].mobility.initialY = 700m

*.bgCell[0].bgTrafficGenerator.numBgUes = 8
*.bgCell[1].bgTrafficGenerator.numBgUes = 6

*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 0.5s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl     = uniform(0.005s, 0.010s)


# ═══════════════════════════════════════════════════════════════════════════
# [Config Train-Mobile]
# Scenario 3 – 2 mobile UEs · 1 gNB · full interference
#
# Extends Train-Multi and adds:
#   - Random waypoint mobility constrained to a 600x600m box centred on
#     the gNB (450,300) so UEs never drift into a permanent dead zone.
#   - 3 background cells with non-uniform power and load so the
#     interference landscape is always asymmetric.
#
# All traffic app definitions are inherited unchanged from Train-Multi.
# ═══════════════════════════════════════════════════════════════════════════
[Config Train-Mobile]
extends    = Train-Multi
repeat     = 50
result-dir = results-train/mobile

# ── UE mobility ───────────────────────────────────────────────────────────
*.ue[*].mobility.typename = "RandomWaypointMobility"

# Constrain waypoint targets to a 600x600m box around the gNB (450,300).
# Max distance from gNB ~424 m — realistic cell edge, not a dead zone.
*.ue[*].mobility.constraintAreaMinX = 150m
*.ue[*].mobility.constraintAreaMinY = 0m
*.ue[*].mobility.constraintAreaMaxX = 750m
*.ue[*].mobility.constraintAreaMaxY = 600m

*.ue[*].mobility.speed    = uniform(1mps, 8mps)
*.ue[*].mobility.waitTime = uniform(1s, 5s)

# ── Background cells ──────────────────────────────────────────────────────
# Override the 2-cell setup inherited from Train-Multi with 3 cells at
# deliberately varied power levels so interference is never symmetric.
*.numBgCells = 3

*.bgCell[0].bgScheduler.txPower = 30dBm
*.bgCell[1].bgScheduler.txPower = 23dBm

*.bgCell[0].mobility.initialX = 750m
*.bgCell[0].mobility.initialY = 300m
*.bgCell[1].mobility.initialX = 150m
*.bgCell[1].mobility.initialY = 700m

*.bgCell[0].bgTrafficGenerator.numBgUes = 8
*.bgCell[1].bgTrafficGenerator.numBgUes = 5

*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 1s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl     = uniform(0.004s, 0.010s)