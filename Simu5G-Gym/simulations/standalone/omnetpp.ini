# omnetpp.ini

# ═══════════════════════════════════════════════════════════════════════════
# [General] – shared base for all configurations
# ═══════════════════════════════════════════════════════════════════════════
[General]
abstract = true

**.routingRecorder.enabled  = false
cmdenv-express-mode         = true
cmdenv-autoflush            = false
cmdenv-status-frequency     = 10s

# ── Statistics ────────────────────────────────────────────────────────────
output-scalar-file          = ${resultdir}/${configname}/${repetition}.sca
output-vector-file          = ${resultdir}/${configname}/${repetition}.vec
seed-set                    = ${repetition}
**.vector-recording         = false
**.scalar-recording         = true
**.statistic-recording      = true
**.collectSinrStatistics    = true

# ── Mobility constraint area ──────────────────────────────────────────────
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

# ── Radio ─────────────────────────────────────────────────────────────────
**.numBands      = 25
**.ueTxPower     = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler    = 0.01
**.blerShift     = 5

# ── Network ───────────────────────────────────────────────────────────────
*.configurator.config = xmldoc("./demo.xml")


# ═══════════════════════════════════════════════════════════════════════════
# [Config Standalone]
# Base NR standalone topology used by all RL scenarios
# ═══════════════════════════════════════════════════════════════════════════
[Config Standalone]
abstract = true
network  = StandaloneGym
sim-time-limit = 20s

# ── Gym interface ─────────────────────────────────────────────────────────
*.gym.host              = "127.0.0.1"
*.gym.port              = 5555
**.gym.action_space     = "Box(low=0.0, high=2.0, shape=(1,))"
*.gym.observation_space = "gym.spaces.Box(low=-1e9, high=1e9, shape=(8,), dtype=float)"
*.gym.tickInterval      = 0.1s

# ── Energy model ──────────────────────────────────────────────────────────
*.gym.pActive    = 100W
*.gym.pSleep     = 10W
*.gym.txPowerMin = 0dBm

# ── gNB ──────────────────────────────────────────────────────────────────
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

# ── UE base (overridden per config) ──────────────────────────────────────
*.numUe = 1
*.ue[*].macCellId   = 0
*.ue[*].masterId    = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId  = 1
*.ue[*].mobility.initialX = uniform(350m, 550m)
*.ue[*].mobility.initialY = uniform(250m, 450m)


# ═══════════════════════════════════════════════════════════════════════════
# [Config VoIP-DL]
# Downlink VoIP baseline (no RL)
# ═══════════════════════════════════════════════════════════════════════════
[Config VoIP-DL]
extends = Standalone

*.numUe          = 20
*.ue[*].numApps  = 1
*.server.numApps = 20

*.ue[*].app[*].typename   = "VoipReceiver"
*.ue[*].app[0].localPort  = 3000

*.server.app[*].typename    = "VoipSender"
*.server.app[*].packetSize  = 40B
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].localPort   = 3088 + ancestorIndex(0)
*.server.app[*].startTime   = uniform(0s, 0.02s)


# ═══════════════════════════════════════════════════════════════════════════
# [Config VoIP-UL]
# Uplink VoIP baseline (no RL)
# ═══════════════════════════════════════════════════════════════════════════
[Config VoIP-UL]
extends  = Standalone
repeat   = 10

*.numUe          = 20
*.ue[*].numApps  = 1
*.server.numApps = 1

*.server.app[*].typename  = "VoipReceiver"
*.server.app[*].localPort = 3000 + ancestorIndex(0)

*.ue[*].app[*].typename    = "VoipSender"
*.ue[*].app[*].packetSize  = 40B
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].localPort   = 3088 + ancestorIndex(0)
*.ue[*].app[*].startTime   = uniform(0s, 0.02s)


# ═══════════════════════════════════════════════════════════════════════════
# [Config CBR-DL-Base]
# Shared CBR downlink + static interference (your original working scenario)
# All RL CBR configs extend this.
# ═══════════════════════════════════════════════════════════════════════════
[Config CBR-DL-Base]
extends  = Standalone
abstract = true

**.bgCellInterference   = true
**.downlinkInterference = true
**.uplinkInterference   = true

# ── UE ───────────────────────────────────────────────────────────────────
*.numUe          = ${numUe=1}
*.ue[*].numApps  = 1
*.server.numApps = ${numUe}

# ── CBR traffic ───────────────────────────────────────────────────────────
*.ue[*].app[*].typename      = "CbrReceiver"
*.ue[*].app[*].localPort     = 3000

*.server.app[*].typename     = "CbrSender"
*.server.app[*].localPort    = 3000 + ancestorIndex(0)
*.server.app[*].destAddress  = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort     = 3000
*.server.app[*].startTime    = uniform(0s, 0.02s)
*.server.app[*].finishTime   = 20s
*.server.app[*].samplingTime = 0.005s
*.server.app[*].packetSize   = 1500B

# ── Background interference cells (static, 2 cells) ──────────────────────
*.numBgCells = 2
*.bgCell[*].bgScheduler.isNr    = true
*.bgCell[*].bgScheduler.txPower = 30dBm

*.bgCell[0].mobility.initialX   = 750m
*.bgCell[0].mobility.initialY   = 300m
*.bgCell[1].mobility.initialX   = 150m
*.bgCell[1].mobility.initialY   = 700m

*.bgCell[*].bgTrafficGenerator.numBgUes                       = 10
*.bgCell[*].bgTrafficGenerator.bgUE[*].mobility.initialX      = uniform(650m, 850m)
*.bgCell[*].bgTrafficGenerator.bgUE[*].mobility.initialY      = uniform(200m, 400m)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 0.05s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl     = 0.005s


# ═══════════════════════════════════════════════════════════════════════════
# [Config CBR-DL-Mobile-Base]
# Extended base that adds:
#   - Random waypoint mobility for UEs
#   - 3 background cells with varied power levels
#   - Varying number of background UEs per cell
#   - Bursty background traffic (randomised period)
# All mobile/realistic scenarios extend this instead of CBR-DL-Base.
# ═══════════════════════════════════════════════════════════════════════════
[Config CBR-DL-Mobile-Base]
extends  = CBR-DL-Base
abstract = true

# ── UE mobility: random waypoint ─────────────────────────────────────────
*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.speed    = uniform(1mps, 15mps)
*.ue[*].mobility.waitTime = uniform(0s, 2s)

# ── 3 background cells with varied power and load ────────────────────────
*.numBgCells = 3

*.bgCell[0].bgScheduler.txPower = 30dBm
*.bgCell[1].bgScheduler.txPower = 23dBm
*.bgCell[2].bgScheduler.txPower = 35dBm

*.bgCell[0].mobility.initialX   = 750m
*.bgCell[0].mobility.initialY   = 300m
*.bgCell[1].mobility.initialX   = 150m
*.bgCell[1].mobility.initialY   = 700m
*.bgCell[2].mobility.initialX   = 500m
*.bgCell[2].mobility.initialY   = 100m

# Different load per cell so interference is never uniform
*.bgCell[0].bgTrafficGenerator.numBgUes = 8
*.bgCell[1].bgTrafficGenerator.numBgUes = 12
*.bgCell[2].bgTrafficGenerator.numBgUes = 5

# Bursty background traffic – period varies per UE
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 1s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl     = uniform(0.004s, 0.010s)


# ═══════════════════════════════════════════════════════════════════════════
# ── Original RL configs (static, your current working scenario) ───────────
# ═══════════════════════════════════════════════════════════════════════════

[Config CBR-DL-PPO]
extends    = CBR-DL-Base
repeat     = 50
result-dir = results-cbr-ppo

[Config CBR-DL-DQN]
extends    = CBR-DL-Base
repeat     = 50
result-dir = results-cbr-dqn


# ═══════════════════════════════════════════════════════════════════════════
# ── VoIP RL configs ────────────────────────────────────────────────────────
# ═══════════════════════════════════════════════════════════════════════════

[Config VoIP-DL-PPO]
extends    = VoIP-DL
repeat     = 50
result-dir = results-voip-ppo

*.server.app[*].silences  = false
*.server.app[*].isTalk    = true
*.server.app[*].scaleTalk = 1000s
*.server.app[*].shapeTalk = 10s

[Config VoIP-DL-DQN]
extends    = VoIP-DL-PPO
result-dir = results-voip-dqn


# ═══════════════════════════════════════════════════════════════════════════
# ── Curriculum: static interference, increasing difficulty ────────────────
#
# Use these to warm-start a new agent before moving to mobile scenarios.
# Train in order: Stage1 → Stage2 → Stage3
# ═══════════════════════════════════════════════════════════════════════════

# Stage 1 – single UE, no interference (learn basic power control)
[Config Curriculum-Stage1-Easy]
extends  = CBR-DL-Base
repeat   = 50
*.numUe  = 1
**.bgCellInterference   = false
**.downlinkInterference = false
**.uplinkInterference   = false
result-dir = results-curriculum/stage1-easy

# Stage 2 – single UE, light interference (5 background UEs per cell)
[Config Curriculum-Stage2-LightInterference]
extends = CBR-DL-Base
repeat  = 50
*.numUe = 1
*.bgCell[*].bgTrafficGenerator.numBgUes = 5
result-dir = results-curriculum/stage2-light-interference

# Stage 3 – single UE, full static interference (your original scenario)
[Config Curriculum-Stage3-FullStatic]
extends    = CBR-DL-Base
repeat     = 50
*.numUe    = 1
result-dir = results-curriculum/stage3-full-static


# ═══════════════════════════════════════════════════════════════════════════
# ── Curriculum: mobile scenarios, increasing difficulty ───────────────────
#
# Continue from Stage3 checkpoint.
# Train in order: Stage4 → Stage5 → Stage6
# ═══════════════════════════════════════════════════════════════════════════

# Stage 4 – single UE with mobility, full interference
[Config Curriculum-Stage4-SingleMobile]
extends    = CBR-DL-Mobile-Base
repeat     = 50
*.numUe    = 1
result-dir = results-curriculum/stage4-single-mobile

# Stage 5 – multiple UEs, static (tests shared resource management)
[Config Curriculum-Stage5-MultiStatic]
extends          = CBR-DL-Base
repeat           = 50
*.numUe          = ${numUeSweep=2,3,5}
*.server.numApps = ${numUeSweep}
result-dir = results-curriculum/stage5-multi-static

# Stage 6 – multiple UEs, mobile (full realistic scenario)
[Config Curriculum-Stage6-MultiMobile]
extends          = CBR-DL-Mobile-Base
repeat           = 50
*.numUe          = ${numUeSweep=2,3,5}
*.server.numApps = ${numUeSweep}
result-dir = results-curriculum/stage6-multi-mobile


# ═══════════════════════════════════════════════════════════════════════════
# ── Stress tests (run after training, eval mode only) ─────────────────────
# ═══════════════════════════════════════════════════════════════════════════

# High interference: push background cell power and load to extremes
[Config Stress-HighInterference]
extends = CBR-DL-Mobile-Base
repeat  = 20
*.numUe = 3
*.bgCell[*].bgScheduler.txPower          = 40dBm
*.bgCell[*].bgTrafficGenerator.numBgUes  = 20
result-dir = results-stress/high-interference

# Edge UE: UE placed at cell edge where SINR is worst
[Config Stress-CellEdge]
extends = CBR-DL-Mobile-Base
repeat  = 20
*.numUe = 1
*.ue[*].mobility.initialX = uniform(600m, 800m)
*.ue[*].mobility.initialY = uniform(500m, 700m)
result-dir = results-stress/cell-edge

# Dense network: maximum UEs and interference simultaneously
[Config Stress-Dense]
extends          = CBR-DL-Mobile-Base
repeat           = 20
*.numUe          = 5
*.server.numApps = 5
*.bgCell[*].bgTrafficGenerator.numBgUes = 15
result-dir = results-stress/dense


# ═══════════════════════════════════════════════════════════════════════════
# ── Evaluation configs (fixed seed for fair comparison) ───────────────────
# ═══════════════════════════════════════════════════════════════════════════

[Config Eval-PPO]
extends    = CBR-DL-Base
repeat     = 20
result-dir = results-eval/ppo

[Config Eval-DQN]
extends    = CBR-DL-Base
repeat     = 20
result-dir = results-eval/dqn

# Fixed seed head-to-head comparison
[Config Eval-Compare-PPO]
extends    = Eval-PPO
seed-set   = 42
result-dir = results-eval/compare/ppo

[Config Eval-Compare-DQN]
extends    = Eval-DQN
seed-set   = 42
result-dir = results-eval/compare/dqn

# Evaluate on mobile scenario (tests generalisation of a statically-trained agent)
[Config Eval-Mobile-PPO]
extends    = CBR-DL-Mobile-Base
repeat     = 20
seed-set   = 42
result-dir = results-eval/mobile/ppo

[Config Eval-Mobile-DQN]
extends    = CBR-DL-Mobile-Base
repeat     = 20
seed-set   = 42
result-dir = results-eval/mobile/dqn




# ═══════════════════════════════════════════════════════════════════════════
# [Config Dynamic-Traffic]
# Traffic demand varies throughout the episode in distinct phases.
# The agent must adapt its power control policy as conditions change.
# Good for final evaluation — tests whether the agent has learned a
# reactive policy rather than memorising a fixed power level.
# ═══════════════════════════════════════════════════════════════════════════

[Config Dynamic-Traffic-Base]
extends  = Standalone
abstract = true
sim-time-limit = 60s       # longer episode so all phases are visible

**.bgCellInterference   = true
**.downlinkInterference = true
**.uplinkInterference   = true

*.numUe          = 1
*.ue[*].numApps  = 3       # 3 apps = 3 traffic phases active at different times
*.server.numApps = 3

*.ue[*].macCellId   = 0
*.ue[*].masterId    = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId  = 1
*.ue[*].mobility.initialX = uniform(350m, 550m)
*.ue[*].mobility.initialY = uniform(250m, 450m)

# ── Phase 1: light load (0s – 20s) ───────────────────────────────────────
*.server.app[0].typename     = "CbrSender"
*.server.app[0].destAddress  = "ue[0]"
*.server.app[0].destPort     = 3000
*.server.app[0].localPort    = 3000
*.server.app[0].packetSize   = 512B
*.server.app[0].samplingTime = 0.005s
*.server.app[0].startTime    = 0s
*.server.app[0].finishTime   = 20s

*.ue[*].app[0].typename  = "CbrReceiver"
*.ue[*].app[0].localPort = 3000

# ── Phase 2: heavy load (20s – 40s) ──────────────────────────────────────
# Overlaps with phase 1 end so there is a ramp-up effect
*.server.app[1].typename     = "CbrSender"
*.server.app[1].destAddress  = "ue[0]"
*.server.app[1].destPort     = 3001
*.server.app[1].localPort    = 3001
*.server.app[1].packetSize   = 1500B
*.server.app[1].samplingTime = 0.005s
*.server.app[1].startTime    = 20s
*.server.app[1].finishTime   = 40s

*.ue[*].app[1].typename  = "CbrReceiver"
*.ue[*].app[1].localPort = 3001

# ── Phase 3: medium load with bursty interference (40s – 60s) ────────────
*.server.app[2].typename     = "CbrSender"
*.server.app[2].destAddress  = "ue[0]"
*.server.app[2].destPort     = 3002
*.server.app[2].localPort    = 3002
*.server.app[2].packetSize   = 1000B
*.server.app[2].samplingTime = 0.005s
*.server.app[2].startTime    = 40s
*.server.app[2].finishTime   = 60s

*.ue[*].app[2].typename  = "CbrReceiver"
*.ue[*].app[2].localPort = 3002

# ── Background interference: also ramps up mid-episode ───────────────────
*.numBgCells = 2
*.bgCell[*].bgScheduler.isNr    = true
*.bgCell[*].bgScheduler.txPower = 30dBm

*.bgCell[0].mobility.initialX   = 750m
*.bgCell[0].mobility.initialY   = 300m
*.bgCell[1].mobility.initialX   = 150m
*.bgCell[1].mobility.initialY   = 700m

# Phase 1: light background (5 UEs)
*.bgCell[*].bgTrafficGenerator.numBgUes                       = 10
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 0.5s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
# Bursty: period varies so interference is not constant
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl     = uniform(0.004s, 0.015s)


[Config Eval-Dynamic-PPO]
extends    = Dynamic-Traffic-Base
repeat     = 20
seed-set   = 42
result-dir = results-eval/dynamic/ppo

[Config Eval-Dynamic-DQN]
extends    = Dynamic-Traffic-Base
repeat     = 20
seed-set   = 42
result-dir = results-eval/dynamic/dqn



# ═══════════════════════════════════════════════════════════════════════════
# [Config VarTraffic-Base]
# Internal base — NOT a runnable config on its own.
#
# Defines three CBR traffic phases per UE:
#   Phase 1  (0s – 20s)   light load   512 B packets
#   Phase 2  (20s – 40s)  heavy load   1500 B packets
#   Phase 3  (40s – 60s)  medium/bursty 1000 B packets
#
# Each concrete training config sets *.numUe and then links
# *.server.numApps = numUe * 3 so every (UE, phase) pair gets
# its own CbrSender.  The UE-side uses 3 CbrReceiver apps on
# ports 3000 / 3001 / 3002.
# ═══════════════════════════════════════════════════════════════════════════
[Config VarTraffic-Base]
extends        = Standalone
abstract       = true
sim-time-limit = 60s          # long enough for all three phases

**.bgCellInterference   = true
**.downlinkInterference = true
**.uplinkInterference   = true

# Every UE runs 3 receiver apps (one per phase)
*.ue[*].numApps = 3
*.ue[*].app[0].typename  = "CbrReceiver"
*.ue[*].app[0].localPort = 3000
*.ue[*].app[1].typename  = "CbrReceiver"
*.ue[*].app[1].localPort = 3001
*.ue[*].app[2].typename  = "CbrReceiver"
*.ue[*].app[2].localPort = 3002

# ── Server-side: numUe * 3 senders ───────────────────────────────────────
# App index layout (N = numUe):
#   [0  .. N-1]   Phase 1 senders  →  ue[i]  port 3000
#   [N  .. 2N-1]  Phase 2 senders  →  ue[i]  port 3001
#   [2N .. 3N-1]  Phase 3 senders  →  ue[i]  port 3002
#
# OMNeT++ evaluates ancestorIndex(0) at each app element, so:
#   Phase 1  block: index i     → UE i           (i mod N  == i)
#   Phase 2  block: index N+i   → UE i
#   Phase 3  block: index 2N+i  → UE i
#
# We use the same typename / destPort tricks as the original CBR-DL-Base.

# --- Phase 1: light load (0 s – 20 s, 512 B) ----------------------------
*.server.app[0].typename     = "CbrSender"
*.server.app[0].destAddress  = "ue[0]"
*.server.app[0].destPort     = 3000
*.server.app[0].localPort    = 4000
*.server.app[0].packetSize   = 512B
*.server.app[0].samplingTime = 0.005s
*.server.app[0].startTime    = 0s
*.server.app[0].finishTime   = 20s

# --- Phase 2: heavy load (20 s – 40 s, 1500 B) --------------------------
*.server.app[1].typename     = "CbrSender"
*.server.app[1].destAddress  = "ue[0]"
*.server.app[1].destPort     = 3001
*.server.app[1].localPort    = 4001
*.server.app[1].packetSize   = 1500B
*.server.app[1].samplingTime = 0.005s
*.server.app[1].startTime    = 20s
*.server.app[1].finishTime   = 40s

# --- Phase 3: medium/bursty load (40 s – 60 s, 1000 B) -----------------
*.server.app[2].typename     = "CbrSender"
*.server.app[2].destAddress  = "ue[0]"
*.server.app[2].destPort     = 3002
*.server.app[2].localPort    = 4002
*.server.app[2].packetSize   = 1000B
*.server.app[2].samplingTime = uniform(0.003s, 0.010s)   # bursty
*.server.app[2].startTime    = 40s
*.server.app[2].finishTime   = 60s


# ═══════════════════════════════════════════════════════════════════════════
# [Config Train-Simple]
# ── Scenario 1: 1 UE · 1 gNB · minor background interference ─────────────
#
# Purpose  : let the agent learn basic downlink power control before
#            it must deal with multi-user resource sharing or mobility.
# Traffic  : three-phase variable load inherited from VarTraffic-Base.
# Interference: 1 background cell, low power (20 dBm), only 3 bg UEs —
#              enough to add noise but not overwhelm an early agent.
# ═══════════════════════════════════════════════════════════════════════════
[Config Train-Simple]
extends    = VarTraffic-Base
repeat     = 50
result-dir = results-train/simple

# One UE, so server needs exactly 3 apps (one per phase)
*.numUe          = 1
*.server.numApps = 3

# ── Minor background interference ─────────────────────────────────────────
*.numBgCells = 1
*.bgCell[0].bgScheduler.isNr    = true
*.bgCell[0].bgScheduler.txPower = 20dBm          # low — minor interference
*.bgCell[0].mobility.initialX   = 750m
*.bgCell[0].mobility.initialY   = 300m

*.bgCell[0].bgTrafficGenerator.numBgUes                       = 3
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 0.5s)
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 512B
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.periodDl     = 0.010s  # light


# ═══════════════════════════════════════════════════════════════════════════
# [Config Train-Multi]
# ── Scenario 2: 2 or 3 UEs · 1 gNB · moderate interference ───────────────
#
# Purpose  : introduce multi-user resource sharing.  The agent must now
#            balance power across several UEs competing for the same
#            scheduler slots.  Run as a parameter sweep (numUe ∈ {2, 3}).
# Traffic  : same three-phase variable load; server spawns numUe senders
#            per phase (total = numUe × 3 apps).
# Interference: 2 background cells at moderate power.
#
# NOTE: because OMNeT++ parameter expressions in array-index position are
# evaluated per-element, we pre-declare the per-phase groups explicitly
# below for clarity.  Adjust if your Simu5G version supports dynamic
# app-index expressions.
# ═══════════════════════════════════════════════════════════════════════════
[Config Train-Multi]
extends    = VarTraffic-Base
repeat     = 50
result-dir = results-train/multi

*.numUe          = ${numUe=2,3}
*.server.numApps = ${numUe} * 3    # e.g. 6 or 9 apps total

# ── Per-UE receiver apps (same for all UE counts) ─────────────────────────
# (Already defined in VarTraffic-Base — no change needed)

# ── Server senders: Phase 1 (index 0 .. numUe-1) ─────────────────────────
*.server.app[*].typename     = "CbrSender"
*.server.app[*].samplingTime = 0.005s

# Phase 1 block — light load
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort    = 3000
*.server.app[0].localPort   = 4000
*.server.app[0].packetSize  = 512B
*.server.app[0].startTime   = 0s
*.server.app[0].finishTime  = 20s

*.server.app[1].destAddress = "ue[1]"
*.server.app[1].destPort    = 3000
*.server.app[1].localPort   = 4001
*.server.app[1].packetSize  = 512B
*.server.app[1].startTime   = 0s
*.server.app[1].finishTime  = 20s

# app[2] only exists when numUe == 3
*.server.app[2].destAddress = "ue[2]"
*.server.app[2].destPort    = 3000
*.server.app[2].localPort   = 4002
*.server.app[2].packetSize  = 512B
*.server.app[2].startTime   = 0s
*.server.app[2].finishTime  = 20s

# Phase 2 block — heavy load (offset by numUe in the index)
*.server.app[3].destAddress = "ue[0]"
*.server.app[3].destPort    = 3001
*.server.app[3].localPort   = 4010
*.server.app[3].packetSize  = 1500B
*.server.app[3].startTime   = 20s
*.server.app[3].finishTime  = 40s

*.server.app[4].destAddress = "ue[1]"
*.server.app[4].destPort    = 3001
*.server.app[4].localPort   = 4011
*.server.app[4].packetSize  = 1500B
*.server.app[4].startTime   = 20s
*.server.app[4].finishTime  = 40s

*.server.app[5].destAddress = "ue[2]"
*.server.app[5].destPort    = 3001
*.server.app[5].localPort   = 4012
*.server.app[5].packetSize  = 1500B
*.server.app[5].startTime   = 20s
*.server.app[5].finishTime  = 40s

# Phase 3 block — medium/bursty load
*.server.app[6].destAddress  = "ue[0]"
*.server.app[6].destPort     = 3002
*.server.app[6].localPort    = 4020
*.server.app[6].packetSize   = 1000B
*.server.app[6].samplingTime = uniform(0.003s, 0.010s)
*.server.app[6].startTime    = 40s
*.server.app[6].finishTime   = 60s

*.server.app[7].destAddress  = "ue[1]"
*.server.app[7].destPort     = 3002
*.server.app[7].localPort    = 4021
*.server.app[7].packetSize   = 1000B
*.server.app[7].samplingTime = uniform(0.003s, 0.010s)
*.server.app[7].startTime    = 40s
*.server.app[7].finishTime   = 60s

*.server.app[8].destAddress  = "ue[2]"
*.server.app[8].destPort     = 3002
*.server.app[8].localPort    = 4022
*.server.app[8].packetSize   = 1000B
*.server.app[8].samplingTime = uniform(0.003s, 0.010s)
*.server.app[8].startTime    = 40s
*.server.app[8].finishTime   = 60s

# ── Moderate background interference ─────────────────────────────────────
*.numBgCells = 2
*.bgCell[*].bgScheduler.isNr    = true
*.bgCell[*].bgScheduler.txPower = 30dBm

*.bgCell[0].mobility.initialX   = 750m
*.bgCell[0].mobility.initialY   = 300m
*.bgCell[1].mobility.initialX   = 150m
*.bgCell[1].mobility.initialY   = 700m

*.bgCell[0].bgTrafficGenerator.numBgUes = 8
*.bgCell[1].bgTrafficGenerator.numBgUes = 6

*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 0.5s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl     = uniform(0.005s, 0.010s)


# ═══════════════════════════════════════════════════════════════════════════
# [Config Train-Mobile]
# ── Scenario 3: 2 or 3 mobile UEs · 1 gNB · full interference ────────────
#
# Purpose  : final training stage — adds random-waypoint mobility so the
#            agent must handle a time-varying channel on top of multi-user
#            resource contention and variable traffic demand.
# Traffic  : same three-phase variable load as Train-Multi.
# Mobility : random waypoint, speed 1 – 15 m/s, wait up to 2 s.
# Interference: 3 background cells with varied power and load, bursty
#              periods — identical to CBR-DL-Mobile-Base.
# ═══════════════════════════════════════════════════════════════════════════
[Config Train-Mobile]
extends    = Train-Multi          # inherits all server app definitions
repeat     = 50
result-dir = results-train/mobile

# ── UE mobility ───────────────────────────────────────────────────────────
*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.speed    = uniform(1mps, 15mps)
*.ue[*].mobility.waitTime = uniform(0s, 2s)

# ── Upgrade to 3 background cells with varied power ───────────────────────
*.numBgCells = 3

*.bgCell[0].bgScheduler.txPower = 30dBm
*.bgCell[1].bgScheduler.txPower = 23dBm
*.bgCell[2].bgScheduler.txPower = 35dBm

*.bgCell[0].mobility.initialX   = 750m
*.bgCell[0].mobility.initialY   = 300m
*.bgCell[1].mobility.initialX   = 150m
*.bgCell[1].mobility.initialY   = 700m
*.bgCell[2].mobility.initialX   = 500m
*.bgCell[2].mobility.initialY   = 100m

# Non-uniform cell load so the interference landscape is never symmetric
*.bgCell[0].bgTrafficGenerator.numBgUes = 8
*.bgCell[1].bgTrafficGenerator.numBgUes = 12
*.bgCell[2].bgTrafficGenerator.numBgUes = 5

# Bursty background traffic — period varies per UE per run
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename     = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl  = uniform(0s, 1s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl     = uniform(0.004s, 0.010s)
